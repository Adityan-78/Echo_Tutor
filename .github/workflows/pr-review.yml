name: PR Review
on:
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests fastapi uvicorn pydantic python-dotenv rich flake8 bandit pyyaml
      - name: Run agent
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
from agent.cli import main
import sys
sys.argv = ['prog','analyze','--provider','github','--repo','${{ github.repository }}','--pr',str(${{ github.event.pull_request.number }})]
try:
  main()
except SystemExit:
  pass
PY
